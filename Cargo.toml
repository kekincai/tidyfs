[package]
name = "tidyfs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
toml = "0.9"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"
